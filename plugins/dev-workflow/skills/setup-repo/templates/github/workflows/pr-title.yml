name: PR title

# Runs on a title or body edit too, so a fixed title or body clears the check without a new push.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          # Tracker content is English: the subject must be printable ASCII.
          subjectPattern: ^[\x20-\x7E]+$
          subjectPatternError: The PR title subject must be written in English (printable ASCII).

      - name: PR body carries no AI attribution line
        env:
          BODY: ${{ github.event.pull_request.body }}
        # Only a line that starts with a trailer matches, so a quoted example inside a sentence passes.
        run: |
          if printf '%s\n' "$BODY" | grep -qiE '^[[:space:]]*(Co-Authored-By:|Generated with|🤖)'; then
            echo '::error::The PR body carries an AI attribution line (AGENTS.md, No AI attribution). Remove it; editing the body reruns this check.'
            exit 1
          fi
