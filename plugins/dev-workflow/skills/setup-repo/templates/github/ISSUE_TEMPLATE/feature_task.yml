name: Feature / Task
description: Build work for a feature or task
title: "Feature: "
labels: ["feature"]
body:
  - type: textarea
    id: description
    attributes:
      label: Work description
      description: What is being built. One issue is one unit of work.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable conditions, each checkable in the running system.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: Related decisions
      description: The decision issues this work implements or relies on.
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Prerequisite issues and contract deliverables.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: No unverified assumptions (upstream docs and running behavior checked first)
        - label: How established products solve the same problem is checked and named
