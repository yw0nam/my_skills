name: Bug
description: Report a behavior defect
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: symptoms
    attributes:
      label: Symptoms
      description: What is wrong.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: "{{fill: the evidence this project produces, e.g. logs, an API response, a screenshot}}. Paste the output."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        {{fill: one "- <item>:" line per version that matters, e.g. OS, project version, runtime version}}
    validations:
      required: true
